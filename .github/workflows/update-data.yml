name: Update Data

on:
  schedule:
    - cron: '0 */8 * * *'   # cada 8h UTC — puede retrasarse (cola de GH)
  workflow_dispatch:        # botón manual en Actions

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run pipeline
        run: node scripts/feed-sources.mjs

      - name: Commit if changed
        run: |
          git config user.name "dm-data-bot"
          git config user.email "dm-data-bot@users.noreply.github.com"
          git add data/faust.json static/data/faust.json static/data/search.json
          if git diff --cached --quiet; then
            echo "no changes — feed sin novedades"
          else
            git commit -m "data: refresh ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push origin main
          fi