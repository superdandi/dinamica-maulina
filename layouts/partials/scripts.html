<script>
/* Globals del sitio para el JS del cliente */
window.DM = {
  base: {{ .Site.BaseURL | jsonify | safeJS }},
  categories: {{ .Site.Params.categories | jsonify (dict "indent" "  ") | safeJS }},
  cities: {{ .Site.Params.cities | jsonify (dict "indent" "  ") | safeJS }},
  corpusPath: {{ "data/search.json" | relURL | jsonify | safeJS }},
  version: {{ (hugo.Data.faust.generatedAt | default "") | jsonify | safeJS }},
  sourceNames: {{ (hugo.Data.faust.sources | default slice) | jsonify (dict "indent" "  ") | safeJS }}
};
</script>
<script src="{{ "lib/fuse.min.js" | relURL }}" defer></script>
<script src="{{ "js/app.js" | relURL }}" defer></script>
<script src="{{ "js/weather.js" | relURL }}" defer></script>
<script src="{{ "js/water.js" | relURL }}" defer></script>
